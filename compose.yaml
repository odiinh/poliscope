name: poliscope

services:
  app:
    image: poliscope:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
